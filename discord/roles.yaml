roles:
  # ==========================================
  # Staff & Administration Roles
  # ==========================================
  - name: Dungeon Master
    color: "#9B59B6" # Royal Amethyst - Supreme realm administrator
    hoist: true
    mentionable: true
    permissions:
      - view_channel
      - send_messages
      - manage_channels
      - manage_roles
      - manage_messages
      - kick_members
      - ban_members
      - read_message_history
      - attach_files
      - embed_links
      - moderate_members
      - view_audit_log

  - name: Paladin
    color: "#3498DB" # Cobalt Blue - Guardian of order and moderator
    hoist: true
    mentionable: true
    permissions:
      - view_channel
      - send_messages
      - manage_messages
      - kick_members
      - moderate_members
      - read_message_history
      - attach_files
      - embed_links

  - name: Artificer
    color: "#E67E22" # Forge Orange - Realm builder, engineer and developer
    hoist: true
    mentionable: true
    permissions:
      - view_channel
      - send_messages
      - read_message_history
      - attach_files
      - embed_links
      - use_application_commands

  - name: Cleric
    color: "#2ECC71" # Emerald Green - Healer, guide and community support
    hoist: true
    mentionable: true
    permissions:
      - view_channel
      - send_messages
      - read_message_history
      - attach_files
      - embed_links

  # ==========================================
  # Adventurer Progression Ranks (Community Tiers)
  # ==========================================
  - name: Mythic Legend
    color: "#F1C40F" # Radiant Gold - Elite realm champions and top contributors
    hoist: true
    mentionable: false
    permissions:
      - view_channel
      - send_messages
      - read_message_history
      - attach_files
      - embed_links
      - add_reactions
      - use_external_emojis
      - use_external_stickers
      - create_public_threads
      - send_messages_in_threads

  - name: Champion
    color: "#E91E63" # Dragon Crimson - Accomplished heroes of the realm
    hoist: true
    mentionable: false
    permissions:
      - view_channel
